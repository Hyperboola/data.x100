# Calendario editoriale di Data%
#
# Ogni giorno ha un macro-tema fisso e dei sottotemi che ruotano: ogni settimana tocca
# al sottotema usato meno di recente. Accanto a ogni sottotema ci sono le categorie del
# catalogo ISTAT da cui pescare i dataset (ogni codice include le sue sottocategorie).
# Codici disponibili: python -m pipeline.categorie --cerca <parola>

# Claude: false = pipeline senza AI. Dataset e serie scelti con regole, grafico da [racconto],
# testi di partenza a modello: li scrivi tu in redazione (python -m pipeline.redazione).
usa_claude = false

# Modello per le chiamate a Claude, quando servono (es. "Suggerisci" in redazione).
# Per scrivere una frase basta un modello leggero: "haiku". Più potenti: "sonnet", "opus".
modello_claude = "haiku"

# Fasce di dati che il job può pubblicare: annuali, trimestrali, mensili
slot = ["annuale", "trimestrale", "mensile"]

# Post al giorno (da 1 a 3). Con 1, le fasce si alternano: ogni giorno si parte da quella
# pubblicata meno di recente, e se non trova niente si passa alla successiva.
post_al_giorno = 1

# Revisione automatica (solo con usa_claude = true): un secondo Claude rilegge la storia con i dati
# completi e cerca affermazioni false. Costa una chiamata in più per post; i dubbi finiscono nel riepilogo.
revisione = true

# Chi sceglie il dataset del giorno tra i candidati del sottotema:
#   "claude"  → Claude li mette in classifica (una chiamata in più, scelte più interessanti)
#   "recente" → il più aggiornato tra quelli non tecnici (nessuna chiamata, scelte più prevedibili)
# Con usa_claude = false vale sempre "recente".
scelta_dataset = "claude"

# Ogni dataset viene usato una volta sola. Quando un sottotema li ha esauriti tutti,
# si ricomincia dai dataset usati meno di recente, ma non prima di queste settimane
# (e Claude deve raccontare una storia diversa dall'ultima volta).
pausa_settimane = 8

# Come raccontare ogni sottotema quando Claude è spento (con Claude acceso è solo un suggerimento).
#   storia: "serie" (un fenomeno nel tempo) o "confronto" (le aree d'Italia nell'ultimo anno)
#   grafico: per le serie "linea", "colonne" o "area"; per i confronti "barre" o "ciambella"
# Se il grafico non è adatto ai dati del giorno, il codice usa il più adatto. Si cambia anche in redazione.
[racconto]
default             = { storia = "serie", grafico = "linea" }
prezzi              = { storia = "serie", grafico = "colonne" }
stipendi_redditi    = { storia = "confronto", per = "territorio", grafico = "barre" }
poverta_disuguaglianze = { storia = "confronto", per = "territorio", grafico = "barre" }
occupazione         = { storia = "confronto", per = "territorio", grafico = "barre" }
nascite             = { storia = "serie", grafico = "linea" }
invecchiamento      = { storia = "serie", grafico = "area" }
stranieri           = { storia = "confronto", per = "territorio", grafico = "barre" }
casa_affitti        = { storia = "serie", grafico = "colonne" }
turismo             = { storia = "confronto", per = "territorio", grafico = "barre" }
tecnologia_internet = { storia = "serie", grafico = "colonne" }

# Età massima dell'ultimo dato, in mesi dalla fine del periodo
[freschezza]
annuale = 24
trimestrale = 7
mensile = 4

# Quanti periodi mostrare nel grafico (13 mesi e 12 trimestri includono l'anno prima)
[finestra]
annuale = 10
trimestrale = 12
mensile = 13

# Temi mai scelti in automatico: richiedono una scelta editoriale umana
[esclusi]
categorie = [
    "POLITICAL_PART",    # partecipazione politica
    "DCIS_SUICIDI",      # suicidi
    "HEA_WOMHEALT",      # interruzioni di gravidanza
    "GENDER_VIOL",       # violenza sulle donne
    "JUS_CRIMINAL",      # reati e procedimenti penali
    "SOC_ACT_RELIG",     # pratica religiosa
]

[giorni.lunedi]
